<div class="page">
  <app-page-header title="Layout lab" subtitle="Vergelijk indelingen met dezelfde data en kaart">
    <ndw-switcher [options]="options" [(selectedValue)]="variant"></ndw-switcher>
  </app-page-header>

  <ng-template #list>
    <ndw-list [elevated]="true">
      @for (incident of data.openIncidents(); track incident.id) {
        <ndw-list-item
          [title]="incident.type + ' · ' + incident.road"
          [subtitle]="incident.location"
          prefixIcon="warning"
          [pillLabel]="incident.severity"
          [pillColor]="severityColor[incident.severity]"
          [active]="selectedId() === incident.id"
          (click)="selectedId.set(incident.id)"
        ></ndw-list-item>
      }
    </ndw-list>
  </ng-template>

  <ng-template #map>
    <app-ndw-map [features]="features()" [selectedId]="selectedId()" (featureSelected)="selectedId.set($event)"></app-ndw-map>
  </ng-template>

  <div class="stage">
    @switch (variant()) {
      @case ('sidebar') {
        <ndw-splitter [initialPanelSize]="380" [minimumPanelSize]="260">
          <div first-panel class="scroll"><ng-container *ngTemplateOutlet="list" /></div>
          <div second-panel class="fill"><ng-container *ngTemplateOutlet="map" /></div>
        </ndw-splitter>
      }
      @case ('floating') {
        <div class="fill floating">
          <ng-container *ngTemplateOutlet="map" />
          <ndw-card class="floating__panel">
            <ndw-card-header>Open incidenten</ndw-card-header>
            <ndw-card-content><ng-container *ngTemplateOutlet="list" /></ndw-card-content>
          </ndw-card>
        </div>
      }
      @case ('stacked') {
        <ndw-splitter [horizontal]="true" [initialPanelSize]="340" [minimumPanelSize]="160">
          <div first-panel class="fill"><ng-container *ngTemplateOutlet="map" /></div>
          <div second-panel class="scroll"><ng-container *ngTemplateOutlet="list" /></div>
        </ndw-splitter>
      }
      @case ('tabs') {
        <ndw-tab-group [(activeTabId)]="activeTab">
          <ndw-tab title="Kaart" id="kaart" icon="map"><div class="tab-body"><ng-container *ngTemplateOutlet="map" /></div></ndw-tab>
          <ndw-tab title="Lijst" id="lijst" icon="list"><div class="tab-body scroll"><ng-container *ngTemplateOutlet="list" /></div></ndw-tab>
        </ndw-tab-group>
      }
    }
  </div>
</div>
