<div class="page">
  <app-page-header title="Incidenten" subtitle="Meldingen op het hoofdwegennet">
    <ndw-switcher [options]="filterOptions" [selectedValue]="filter()" (selectionChange)="setFilter($event)"></ndw-switcher>
  </app-page-header>

  <div class="split">
    <aside class="list" aria-label="Incidentenlijst">
      <ndw-list [elevated]="true">
        @for (incident of incidents(); track incident.id) {
          <ndw-list-item
            [title]="incident.type + ' · ' + incident.road + ' ' + incident.direction"
            [subtitle]="incident.location + ' · ' + minutesAgo(incident.startedAt)"
            prefixIcon="warning"
            [pillLabel]="incident.severity"
            [pillColor]="severityColor[incident.severity]"
            [active]="selectedId() === incident.id"
            (click)="selectedId.set(incident.id)"
          ></ndw-list-item>
        } @empty {
          <ndw-list-item title="Geen incidenten voor dit filter"></ndw-list-item>
        }
      </ndw-list>
    </aside>

    <div class="map">
      <app-ndw-map [features]="features()" [kinds]="['incident', 'jam']" [selectedId]="selectedId()" (featureSelected)="selectedId.set($event)"></app-ndw-map>

      @if (selected(); as incident) {
        <ndw-card class="detail">
          <ndw-card-header>{{ incident.type }} · {{ incident.id }}</ndw-card-header>
          <ndw-card-content>
            <div class="pills">
              <ndw-pill [color]="severityColor[incident.severity]">Ernst {{ incident.severity }}</ndw-pill>
              <ndw-pill [color]="statusColor[incident.status]">{{ incident.status }}</ndw-pill>
            </div>
            <p class="ndw-paragraph-md">{{ incident.description }}</p>
            <ndw-key-value-list [data]="details()"></ndw-key-value-list>
            <p class="ndw-paragraph-sm">Gemeld om {{ incident.startedAt | date: 'HH:mm' }}</p>
            <button ndwButton tertiary extra-small (click)="selectedId.set(null)"><ndw-icon>close</ndw-icon> Sluiten</button>
          </ndw-card-content>
        </ndw-card>
      }
    </div>
  </div>
</div>
