<div class="page">
  <app-page-header title="Wegwerkzaamheden" subtitle="Geplande en actieve werkzaamheden op het wegennet">
    <ndw-switcher [options]="viewOptions" [(selectedValue)]="view"></ndw-switcher>
  </app-page-header>

  <div class="filters">
    <ndw-form-field label="Zoeken" [hideLabel]="true">
      <div class="input-container">
        <ndw-input-icon><ndw-icon>search</ndw-icon></ndw-input-icon>
        <input ndwInput type="search" placeholder="Zoek op titel, weg of nummer" [ngModel]="query()" (ngModelChange)="query.set($event)" />
      </div>
    </ndw-form-field>
    <ndw-switcher [options]="statusOptions" [(selectedValue)]="status"></ndw-switcher>
  </div>

  @if (view() === 'tabel') {
    <ag-grid-angular class="grid" [theme]="theme" [columnDefs]="columns" [rowData]="rows()" [autoSizeStrategy]="autoSize" domLayout="autoHeight" (rowClicked)="openDetail($event)" (cellKeyDown)="openOnEnter($event)" />
  } @else {
    <div class="map">
      <app-ndw-map [features]="features()" [kinds]="['roadwork']" [showLegend]="false" (featureSelected)="openById($event)"></app-ndw-map>
    </div>
  }
</div>
